; ============================================
; VEEDO.RO - php.ini local pentru DirectAdmin
; Pune acest fișier în rădăcina site-ului (public_html/)
; DirectAdmin îl citește automat pentru PHP-FPM
; ============================================

; Upload limits
upload_max_filesize = 256M
post_max_size = 260M
max_file_uploads = 20

; Timeout - shared hosting limitează de obicei la 30-60s
max_execution_time = 120
max_input_time = 120

; Memorie
memory_limit = 256M

; Sesiuni - securizate
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
session.gc_maxlifetime = 2592000

; Securitate
expose_php = Off
display_errors = Off
log_errors = On
error_log = /home/gestiuneflota/logs/veedo_php_errors.log

; Charset
default_charset = UTF-8

; Timezone
date.timezone = Europe/Bucharest

; Dezactivat pe shared hosting (nu le folosim dacă nu există)
; allow_url_fopen = Off   ; nu dezactiva - poate fi necesar pt email
